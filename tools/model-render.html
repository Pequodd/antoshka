<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head><body>
<canvas id="c" width="1600" height="1200"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../v10/products.js"></script>
<script src="../v10/viewer.js"></script>
<script>
/* Catalog pictures from the same per-product models as the live viewer: ?id=<product id>&u=in|out&a=<yaw>. Transparent, 1600x1200. */
const q = new URLSearchParams(location.search), p = CS_PRODUCTS.find(x => x.id === q.get('id')) || CS_PRODUCTS[0];
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1600, 1200, false); renderer.setClearColor(0, 0);
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .95;
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(26, 4 / 3, .1, 100);
scene.environment = CSModels.studio(renderer); CSModels.lights(scene);
const m = CSModels.build(p, q.get('u') || 'in'); scene.add(m.group); m.group.rotation.y = +(q.get('a') ?? -.45);
/* frame by the turned unit's own size: it fills about 82% of the picture */
m.group.updateMatrixWorld(true); const sz = new THREE.Box3().setFromObject(m.group).getSize(new THREE.Vector3()), t = Math.tan(THREE.MathUtils.degToRad(13));
const z = Math.max(sz.x / (2 * t * 4 / 3), sz.y / (2 * t)) / .82 + sz.z / 2; camera.position.set(0, z * .06, z); camera.lookAt(0, 0, 0);
renderer.render(scene, camera); document.title = 'ready';
</script></body></html>
